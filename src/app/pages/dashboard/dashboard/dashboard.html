<section>
  <h2 class="text-2xl font-bold tracking-tight">{{ 'DASHBOARD_PAGE_TITLE' | translate }}</h2>
  <p class="mt-2 text-sm text-[var(--color-on-surface-muted)]">{{ 'DASHBOARD_PAGE_SUBTITLE' | translate }}</p>

  <div class="mt-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    @for (card of cards; track card.key) {
      <article class="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4 shadow-sm">
        <p class="text-sm text-[var(--color-on-surface-muted)]">{{ card.key | translate }}</p>
        <p class="mt-2 text-2xl font-semibold">{{ card.value }}</p>
        <p class="mt-1 text-sm text-[var(--color-success)]">{{ card.trend }}</p>
      </article>
    }
  </div>
</section>
