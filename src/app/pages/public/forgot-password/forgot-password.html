<section class="mx-auto w-full max-w-md px-4 pt-14 pb-12 sm:px-6">
  <div class="rounded-2xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-sm sm:p-8">
    <h1 class="text-2xl font-bold">{{ 'FORGOT_PASSWORD_TITLE' | translate }}</h1>
    <p class="mt-2 text-sm text-[var(--color-on-surface-muted)]">{{ 'FORGOT_PASSWORD_SUBTITLE' | translate }}</p>

    @if (!requestSubmitted()) {
      <form class="mt-6 space-y-4" (submit)="submitResetRequest($event)">
        <div>
          <label for="forgot-email" class="mb-1 block text-sm font-medium">{{ 'FORGOT_PASSWORD_EMAIL_LABEL' | translate }}</label>
          <input id="forgot-email" type="email" class="w-full rounded-lg border border-[var(--color-border)] bg-transparent px-3 py-2.5 text-sm outline-none transition-colors focus:border-[var(--color-primary)]" [placeholder]="'FORGOT_PASSWORD_EMAIL_PLACEHOLDER' | translate" />
        </div>

        <button mat-flat-button type="submit" class="!w-full !rounded-lg !bg-[var(--color-primary)] !py-2.5 !text-white">
          {{ 'FORGOT_PASSWORD_SUBMIT' | translate }}
        </button>
      </form>
    } @else {
      <div class="mt-6 rounded-xl border border-[var(--color-success)]/40 bg-[color-mix(in_srgb,var(--color-success)_14%,transparent)] p-4">
        <p class="text-sm leading-6 text-[var(--color-on-surface)]">{{ 'FORGOT_PASSWORD_CONFIRMATION' | translate }}</p>
      </div>
    }
  </div>
</section>
