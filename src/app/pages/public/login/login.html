<section class="mx-auto w-full max-w-md px-4 pt-14 pb-12 sm:px-6">
  <div class="rounded-2xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-sm sm:p-8">
    <h1 class="text-2xl font-bold">{{ 'LOGIN_TITLE' | translate }}</h1>
    <p class="mt-2 text-sm text-[var(--color-on-surface-muted)]">{{ 'LOGIN_SUBTITLE' | translate }}</p>

    <form class="mt-6 space-y-4">
      <div>
        <label for="email" class="mb-1 block text-sm font-medium">{{ 'LOGIN_EMAIL_LABEL' | translate }}</label>
        <input id="email" type="email" class="w-full rounded-lg border border-[var(--color-border)] bg-transparent px-3 py-2.5 text-sm outline-none transition-colors focus:border-[var(--color-primary)]" [placeholder]="'LOGIN_EMAIL_PLACEHOLDER' | translate" />
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium">{{ 'LOGIN_PASSWORD_LABEL' | translate }}</label>
        <input id="password" type="password" class="w-full rounded-lg border border-[var(--color-border)] bg-transparent px-3 py-2.5 text-sm outline-none transition-colors focus:border-[var(--color-primary)]" [placeholder]="'LOGIN_PASSWORD_PLACEHOLDER' | translate" />
      </div>

      <a routerLink="/forgot-password" class="inline-block text-sm text-[var(--color-primary)] hover:underline">{{ 'LOGIN_FORGOT_PASSWORD' | translate }}</a>

      <button mat-flat-button type="submit" class="!mt-2 !w-full !rounded-lg !bg-[var(--color-primary)] !py-2.5 !text-white">
        {{ 'LOGIN_SUBMIT' | translate }}
      </button>
    </form>

    <p class="mt-5 text-sm text-[var(--color-on-surface-muted)]">
      {{ 'LOGIN_NO_ACCOUNT' | translate }}
      <a routerLink="/sign-up" class="font-medium text-[var(--color-primary)] hover:underline">{{ 'LOGIN_SIGNUP_LINK' | translate }}</a>
    </p>
  </div>
</section>
