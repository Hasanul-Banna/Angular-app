<label
  [class]="'theme-toggle-shell group relative inline-flex h-8 w-14 shrink-0 cursor-pointer items-center overflow-hidden rounded-full shadow-[inset_0_1px_3px_rgba(0,0,0,0.2)] transition-colors duration-300 ease-out ' + (activeTheme() === 'light' ? 'bg-[linear-gradient(135deg,color-mix(in_srgb,var(--color-info)_55%,white_12%),color-mix(in_srgb,var(--color-primary)_55%,white_12%))]' : 'bg-[linear-gradient(135deg,var(--color-dark),color-mix(in_srgb,var(--color-surface)_65%,black_12%))]')"
  [attr.aria-label]="('theme.appearance' | translate) + ': ' + (activeTheme() === 'light' ? ('theme.dark' | translate) : ('theme.light' | translate))"
  [attr.title]="('theme.appearance' | translate) + ': ' + (activeTheme() === 'light' ? ('theme.dark' | translate) : ('theme.light' | translate))"
>
  <input
    type="checkbox"
    class="peer sr-only"
    [checked]="activeTheme() === 'dark'"
    [attr.aria-checked]="activeTheme() === 'dark'"
    [attr.aria-label]="('theme.appearance' | translate) + ': ' + (activeTheme() === 'light' ? ('theme.dark' | translate) : ('theme.light' | translate))"
    (change)="toggleTheme()"
  />

  <span
    class="theme-toggle-thumb pointer-events-none absolute left-1 top-1/2 z-20 inline-flex h-6 w-6 -translate-y-1/2 items-center justify-center rounded-full bg-white shadow-[0_2px_6px_rgba(0,0,0,0.35)] ring-1 ring-black/10 transition-[transform,box-shadow] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] peer-checked:translate-x-6 peer-checked:shadow-[0_0_2px_1px_var(--color-primary),0_0_12px_3px_color-mix(in_srgb,var(--color-primary)_65%,transparent),0_0_22px_6px_color-mix(in_srgb,var(--color-primary)_40%,transparent)] peer-checked:ring-[var(--color-primary)]"
  >
    @if (activeTheme() === 'light') {
      <svg viewBox="0 0 24 24" class="theme-toggle-icon h-3.5 w-3.5 text-[var(--color-warning)]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" />
        <path d="M12 2.5v2.2M12 19.3v2.2M4.7 4.7l1.6 1.6M17.7 17.7l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.7 19.3l1.6-1.6M17.7 6.3l1.6-1.6" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" class="theme-toggle-icon h-3.5 w-3.5 text-[var(--color-primary)]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.4 14.2A8.8 8.8 0 1 1 9.8 3.6a7.1 7.1 0 0 0 10.6 10.6z" />
      </svg>
    }
  </span>
</label>
